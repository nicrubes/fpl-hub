name: FPL Hub hourly update

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 past
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      test_email:
        description: 'Send a test email now'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-hub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site and send any due email
        run: node build.js ${{ inputs.test_email && '--test-email' || '' }}
        env:
          FPL_PASSCODE: ${{ secrets.FPL_PASSCODE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Remember which emails were sent
        run: |
          git config user.name "fpl-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Record sent email" && git push)

      - if: hashFiles('site/index.html') != ''
        uses: actions/configure-pages@v5

      - if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: hashFiles('site/index.html') != ''
        id: deploy
        uses: actions/deploy-pages@v4
