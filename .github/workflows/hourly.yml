name: FPL Hub hourly update

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 past
  workflow_dispatch:        # "Run workflow" button for a manual refresh
    inputs:
      test_email:
        description: 'Send a test email now'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-hub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site and send any due email
        run: node build.js ${{ inputs.test_email && '--test-email' || '' }}
        env:
          FPL_PASSCODE: ${{ secrets.FPL_PASSCODE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Remember which emails were sent (and the locked Superbru odds and picks)
        run: |
          git config user.name "fpl-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -d data/superbru ]; then git add data/superbru; fi
          git diff --cached --quiet || (git commit -m "Record sent email / Superbru odds" && git push)

      - if: hashFiles('site/index.html') != ''
        uses: actions/configure-pages@v5

      - if: hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub sometimes can't "see" the site files for a few seconds after
      # they're uploaded ("No artifacts named github-pages were found").
      # So: wait a moment, try, and if that fails wait longer and try again.
      # Only if the second try also fails does the run count as failed.
      - if: hashFiles('site/index.html') != ''
        run: sleep 15

      - if: hashFiles('site/index.html') != ''
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - if: hashFiles('site/index.html') != '' && steps.deploy.outcome == 'failure'
        run: sleep 60

      - if: hashFiles('site/index.html') != '' && steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
